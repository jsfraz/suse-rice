# hyprlogin greeter UI. Install to /etc/hyprlogin/hyprlogin.conf
# (greeter cannot read $HOME). Colors come from colors.conf (matugen).

source = /etc/hyprlogin/colors.conf

sessions {
    default_user = razj
    default_session = hyprland.desktop
}

$font = FiraCode Nerd Font

general {
    hide_cursor = false
    immediate_render = true
    exit_command = hyprctl dispatch exit
    fail_timeout = 4000
    debug_mode = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/hypr/wall2.png
    color = $bg_color
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = $inner_color
    outer_color = $active_border $active_border_alt 45deg
    check_color = $check_color $check_color_alt 120deg
    fail_color = $fail_color $fail_color_alt 40deg
    font_color = $font_color
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Input password...
    placeholder_text_username = Input username...
    fail_text = $FAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $font_color
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    color = $muted_color
    font_size = 24
    onclick = hyprctl switchxkblayout all next
    position = 250, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $GREETD_SESSION
    font_size = 16
    color = $muted_color
    font_family = $font
    onclick = hyprlogin:session_next
    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = Login as $GREETD_USER
    color = $font_color
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
    hide_when_empty = true
}
