"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$all\
$username \
$character"""

palette = 'colors'

[palettes.colors]
<* if {{ is_dark_mode }} *>
primary = '{{ colors.primary.default.hex | set_saturation: 80.0 | set_lightness: 55.0 }}'
secondary = '{{ colors.primary.default.hex | set_hue: 185.0 | set_saturation: 82.0 | set_lightness: 50.0 }}'
tertiary = '{{ colors.primary.default.hex | set_hue: 140.0 | set_saturation: 78.0 | set_lightness: 48.0 }}'
accent = '{{ colors.primary.default.hex | set_hue: 48.0 | set_saturation: 90.0 | set_lightness: 54.0 }}'
on_surface = '{{ colors.on_surface.default.hex }}'
fail = '{{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 52.0 }}'
<* else *>
primary = '{{ colors.primary.default.hex | set_saturation: 86.0 | set_lightness: 40.0 }}'
secondary = '{{ colors.primary.default.hex | set_hue: 185.0 | set_saturation: 82.0 | set_lightness: 30.0 }}'
tertiary = '{{ colors.primary.default.hex | set_hue: 148.0 | set_saturation: 88.0 | set_lightness: 28.0 }}'
accent = '{{ colors.primary.default.hex | set_hue: 36.0 | set_saturation: 90.0 | set_lightness: 36.0 }}'
on_surface = '{{ colors.on_surface.default.hex | set_lightness: 12.0 }}'
fail = '{{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 86.0 | set_lightness: 42.0 }}'
<* endif *>

