# --- Main Colors ---
# Tinted by wallpaper seed; lightness follows dark/light so text stays readable.
<* if {{ is_dark_mode }} *>
background            {{ colors.source_color.default.hex | set_lightness: 16.0 | set_saturation: 42.0 }}
cursor_text_color     {{ colors.source_color.default.hex | set_lightness: 16.0 | set_saturation: 42.0 }}
color0                {{ colors.source_color.default.hex | set_lightness: 10.0 | set_saturation: 40.0 }}
foreground            {{ colors.on_surface.default.hex }}
cursor                {{ colors.on_surface.default.hex }}
color7                {{ colors.on_surface.default.hex }}
background_opacity    0.33
<* else *>
background            {{ colors.source_color.default.hex | set_lightness: 96.0 | set_saturation: 12.0 }}
cursor_text_color     {{ colors.source_color.default.hex | set_lightness: 96.0 | set_saturation: 12.0 }}
color0                {{ colors.source_color.default.hex | set_lightness: 90.0 | set_saturation: 10.0 }}
foreground            {{ colors.on_surface.default.hex | set_lightness: 8.0 }}
cursor                {{ colors.on_surface.default.hex | set_lightness: 8.0 }}
color7                {{ colors.on_surface.default.hex | set_lightness: 8.0 }}
background_opacity    0.66
<* endif *>

selection_background  {{ colors.secondary_container.default.hex }}
selection_foreground  {{ colors.on_secondary_container.default.hex }}

url_color             {{ colors.primary.default.hex | set_hue: 215.0 | set_saturation: 80.0 | set_lightness: 55.0 }}

