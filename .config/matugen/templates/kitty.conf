# --- UI Elements ---
# Dark tabs are a light gel capsule on night glass. Light tabs are a saturated capsule on pale glass.
<* if {{ is_dark_mode }} *>
active_tab_foreground   {{ colors.primary.default.hex | set_saturation: 42.0 | set_lightness: 16.0 }}
active_tab_background   {{ colors.primary.default.hex | set_saturation: 72.0 | set_lightness: 72.0 }}
inactive_tab_foreground {{ colors.primary.default.hex | set_saturation: 22.0 | set_lightness: 86.0 }}
inactive_tab_background {{ colors.primary.default.hex | set_saturation: 36.0 | set_lightness: 24.0 }}
active_border_color     {{ colors.primary.default.hex | set_saturation: 78.0 | set_lightness: 62.0 }}
inactive_border_color   {{ colors.outline.default.hex }}
scrollbar_handle_color  {{ colors.primary.default.hex | set_saturation: 64.0 | set_lightness: 64.0 }}
cursor_trail_color      {{ colors.primary.default.hex | set_saturation: 80.0 | set_lightness: 62.0 }}
<* else *>
active_tab_foreground   {{ colors.primary.default.hex | set_saturation: 20.0 | set_lightness: 98.0 }}
active_tab_background   {{ colors.primary.default.hex | set_saturation: 86.0 | set_lightness: 48.0 }}
inactive_tab_foreground {{ colors.on_surface_variant.default.hex | set_lightness: 28.0 }}
inactive_tab_background {{ colors.primary.default.hex | set_saturation: 35.0 | set_lightness: 86.0 }}
