# --- Frosted glass ---
# Opacity reload needs dynamic_background_opacity. The image has to match the mode or the tint goes muddy.
<* if {{ is_dark_mode }} *>
background_image            glass.png
background_opacity          0.50
background_tint             0.40
inactive_text_alpha         0.78
dim_opacity                 0.55
text_composition_strategy   1.15 18
text_fg_override_threshold  0
<* else *>
background_image            glass-light.png
background_opacity          0.45
background_tint             0.30
inactive_text_alpha         0.90
dim_opacity                 0.62
text_composition_strategy   1.38 12
text_fg_override_threshold  3.0 ratio
<* endif *>
background_image_layout     scaled
background_image_linear     yes
