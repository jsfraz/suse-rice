# --- Main Colors ---
# Dark: tinted night glass and light type. Light: pale seed glass and dark ink.
<* if {{ is_dark_mode }} *>
background            {{ colors.source_color.default.hex | set_lightness: 14.0 | set_saturation: 42.0 }}
cursor_text_color     {{ colors.source_color.default.hex | set_lightness: 14.0 | set_saturation: 42.0 }}
color0                {{ colors.source_color.default.hex | set_lightness: 8.0 | set_saturation: 36.0 }}
foreground            {{ colors.on_surface.default.hex }}
cursor                {{ colors.on_surface.default.hex }}
color7                {{ colors.on_surface.default.hex }}
color8                {{ colors.surface_variant.default.hex }}
color15               {{ colors.on_surface_variant.default.hex }}
<* else *>
background            {{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 93.0 }}
cursor_text_color     {{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 93.0 }}
# True dark "black": light-theme CLI tools that print black must stay visible.
color0                {{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 18.0 }}
foreground            {{ colors.on_surface.default.hex | set_lightness: 12.0 }}
cursor                {{ colors.on_surface.default.hex | set_lightness: 12.0 }}
# "White" maps to dark ink so prompts using ANSI white stay readable.
color7                {{ colors.on_surface.default.hex | set_lightness: 12.0 }}
color8                {{ colors.source_color.default.hex | set_saturation: 18.0 | set_lightness: 42.0 }}
color15               {{ colors.on_surface.default.hex | set_lightness: 22.0 }}
<* endif *>

selection_background  {{ colors.secondary_container.default.hex }}
selection_foreground  {{ colors.on_secondary_container.default.hex }}

