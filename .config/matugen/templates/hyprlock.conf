<* if {{ is_dark_mode }} *>
$font_color = rgba({{ colors.on_surface.default.hex_stripped }}ff)
$muted = rgba({{ colors.on_surface_variant.default.hex_stripped }}cc)
$glass = rgba({{ colors.primary.default.hex | set_saturation: 48.0 | set_lightness: 22.0 | replace: "#", "" }}75)
$glass_deep = rgba({{ colors.primary.default.hex | set_saturation: 52.0 | set_lightness: 12.0 | replace: "#", "" }}9e)
$rim = rgba({{ colors.primary.default.hex | set_saturation: 22.0 | set_lightness: 92.0 | replace: "#", "" }}9e)
$input_inner = rgba({{ colors.primary.default.hex | set_saturation: 36.0 | set_lightness: 16.0 | replace: "#", "" }}ee)
$rim_input = rgba({{ colors.primary.default.hex | set_saturation: 30.0 | set_lightness: 72.0 | replace: "#", "" }}cc)
$check_color = rgba({{ colors.primary.default.hex | set_hue: 140.0 | set_saturation: 78.0 | set_lightness: 48.0 | replace: "#", "" }}ee)
$check_color_alt = rgba({{ colors.primary.default.hex | set_hue: 48.0 | set_saturation: 90.0 | set_lightness: 54.0 | replace: "#", "" }}ee)
$fail_color = rgba({{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 52.0 | replace: "#", "" }}ee)
$fail_color_alt = rgba({{ colors.primary.default.hex | set_hue: 300.0 | set_saturation: 72.0 | set_lightness: 55.0 | replace: "#", "" }}ee)
$shadow = rgba({{ colors.shadow.default.hex_stripped }}52)
<* else *>
$font_color = rgba({{ colors.on_surface.default.hex | set_lightness: 10.0 | replace: "#", "" }}ff)
$muted = rgba({{ colors.on_surface_variant.default.hex | set_lightness: 28.0 | replace: "#", "" }}ff)
$glass = rgba({{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 94.0 | replace: "#", "" }}c7)
$glass_deep = rgba({{ colors.source_color.default.hex | set_saturation: 22.0 | set_lightness: 88.0 | replace: "#", "" }}d4)
$rim = rgba({{ colors.primary.default.hex | set_saturation: 30.0 | set_lightness: 70.0 | replace: "#", "" }}99)
$input_inner = rgba({{ colors.primary.default.hex | set_saturation: 18.0 | set_lightness: 97.0 | replace: "#", "" }}f2)
$rim_input = rgba({{ colors.primary.default.hex | set_saturation: 40.0 | set_lightness: 55.0 | replace: "#", "" }}aa)
$check_color = rgba({{ colors.primary.default.hex | set_hue: 140.0 | set_saturation: 78.0 | set_lightness: 38.0 | replace: "#", "" }}ff)
$check_color_alt = rgba({{ colors.primary.default.hex | set_hue: 48.0 | set_saturation: 90.0 | set_lightness: 42.0 | replace: "#", "" }}ff)
$fail_color = rgba({{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 42.0 | replace: "#", "" }}ff)
$fail_color_alt = rgba({{ colors.primary.default.hex | set_hue: 300.0 | set_saturation: 72.0 | set_lightness: 42.0 | replace: "#", "" }}ff)
$shadow = rgba({{ colors.shadow.default.hex_stripped }}33)
<* endif *>
