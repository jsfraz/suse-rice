<* if {{ is_dark_mode }} *>
# Same Aero glass as waybar and rofi. White type, vivid seed glass.
$font_color = rgba({{ colors.primary.default.hex | set_saturation: 12.0 | set_lightness: 99.0 | replace: "#", "" }}ff)
$muted = rgba({{ colors.primary.default.hex | set_saturation: 18.0 | set_lightness: 86.0 | replace: "#", "" }}ee)
$glass = rgba({{ colors.primary.default.hex | set_saturation: 64.0 | set_lightness: 46.0 | replace: "#", "" }}8c)
$rim = rgba({{ colors.primary.default.hex | set_saturation: 8.0 | set_lightness: 100.0 | replace: "#", "" }}f0)
$rim_soft = rgba({{ colors.primary.default.hex | set_saturation: 36.0 | set_lightness: 74.0 | replace: "#", "" }}66)
$input_font = rgba({{ colors.primary.default.hex | set_saturation: 12.0 | set_lightness: 99.0 | replace: "#", "" }}ff)
$rim_input = rgba({{ colors.primary.default.hex | set_saturation: 8.0 | set_lightness: 100.0 | replace: "#", "" }}f5)
$text_shadow = rgba({{ colors.shadow.default.hex_stripped }}ff)
$date_shadow = rgba({{ colors.shadow.default.hex_stripped }}ff)
$check_color = rgba({{ colors.primary.default.hex | set_hue: 148.0 | set_saturation: 78.0 | set_lightness: 48.0 | replace: "#", "" }}ff)
$check_color_alt = rgba({{ colors.primary.default.hex | set_hue: 48.0 | set_saturation: 90.0 | set_lightness: 52.0 | replace: "#", "" }}ff)
$fail_color = rgba({{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 52.0 | replace: "#", "" }}ff)
$fail_color_alt = rgba({{ colors.primary.default.hex | set_hue: 300.0 | set_saturation: 72.0 | set_lightness: 52.0 | replace: "#", "" }}ff)
$shadow = rgba({{ colors.shadow.default.hex_stripped }}73)
<* else *>
# Pale seed glass, dark ink. Same split as waybar light mode.
$font_color = rgba({{ colors.on_surface.default.hex | set_lightness: 12.0 | replace: "#", "" }}ff)
$muted = rgba({{ colors.on_surface_variant.default.hex | set_lightness: 32.0 | replace: "#", "" }}ff)
$glass = rgba({{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 94.0 | replace: "#", "" }}b8)
$rim = rgba({{ colors.primary.default.hex | set_saturation: 12.0 | set_lightness: 100.0 | replace: "#", "" }}f2)
$rim_soft = rgba({{ colors.primary.default.hex | set_saturation: 28.0 | set_lightness: 86.0 | replace: "#", "" }}80)
$input_font = rgba({{ colors.on_surface.default.hex | set_lightness: 12.0 | replace: "#", "" }}ff)
$rim_input = rgba({{ colors.on_surface.default.hex | set_lightness: 12.0 | replace: "#", "" }}ee)
$text_shadow = rgba({{ colors.shadow.default.hex_stripped }}ff)
$date_shadow = rgba({{ colors.shadow.default.hex_stripped }}ff)
$check_color = rgba({{ colors.primary.default.hex | set_hue: 148.0 | set_saturation: 86.0 | set_lightness: 38.0 | replace: "#", "" }}ff)
$check_color_alt = rgba({{ colors.primary.default.hex | set_hue: 36.0 | set_saturation: 92.0 | set_lightness: 46.0 | replace: "#", "" }}ff)
$fail_color = rgba({{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 48.0 | replace: "#", "" }}ff)
$fail_color_alt = rgba({{ colors.primary.default.hex | set_hue: 300.0 | set_saturation: 72.0 | set_lightness: 46.0 | replace: "#", "" }}ff)
$shadow = rgba({{ colors.shadow.default.hex_stripped }}59)
<* endif *>
