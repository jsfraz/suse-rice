<* if {{ is_dark_mode }} *>
$font_color = rgba({{ colors.on_surface.default.hex | set_lightness: 10.0 | replace: "#", "" }}ff)
$muted = rgba({{ colors.on_surface_variant.default.hex | set_lightness: 28.0 | replace: "#", "" }}ff)
$glass = rgba({{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 94.0 | replace: "#", "" }}80)
$glass_deep = rgba({{ colors.source_color.default.hex | set_saturation: 22.0 | set_lightness: 88.0 | replace: "#", "" }}99)
$rim = rgba({{ colors.primary.default.hex | set_saturation: 30.0 | set_lightness: 70.0 | replace: "#", "" }}99)
$input_inner = rgba({{ colors.primary.default.hex | set_saturation: 18.0 | set_lightness: 97.0 | replace: "#", "" }}f2)
$rim_input = rgba({{ colors.primary.default.hex | set_saturation: 40.0 | set_lightness: 55.0 | replace: "#", "" }}aa)
$check_color = rgba({{ colors.primary.default.hex | set_hue: 140.0 | set_saturation: 78.0 | set_lightness: 38.0 | replace: "#", "" }}ff)
$check_color_alt = rgba({{ colors.primary.default.hex | set_hue: 48.0 | set_saturation: 90.0 | set_lightness: 42.0 | replace: "#", "" }}ff)
$fail_color = rgba({{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 42.0 | replace: "#", "" }}ff)
$fail_color_alt = rgba({{ colors.primary.default.hex | set_hue: 300.0 | set_saturation: 72.0 | set_lightness: 42.0 | replace: "#", "" }}ff)
$shadow = rgba({{ colors.shadow.default.hex_stripped }}33)
<* else *>
$font_color = rgba({{ colors.on_surface.default.hex | set_lightness: 12.0 | replace: "#", "" }}ff)
$muted = rgba({{ colors.on_surface_variant.default.hex | set_lightness: 28.0 | replace: "#", "" }}ff)
$glass = rgba({{ colors.source_color.default.hex | set_saturation: 28.0 | set_lightness: 93.0 | replace: "#", "" }}80)
$glass_deep = rgba({{ colors.source_color.default.hex | set_saturation: 34.0 | set_lightness: 82.0 | replace: "#", "" }}99)
$rim = rgba({{ colors.primary.default.hex | set_saturation: 40.0 | set_lightness: 100.0 | replace: "#", "" }}cc)
$input_inner = rgba({{ colors.primary.default.hex | set_saturation: 35.0 | set_lightness: 86.0 | replace: "#", "" }}8c)
$rim_input = rgba({{ colors.primary.default.hex | set_saturation: 20.0 | set_lightness: 100.0 | replace: "#", "" }}e6)
$check_color = rgba({{ colors.primary.default.hex | set_hue: 148.0 | set_saturation: 86.0 | set_lightness: 34.0 | replace: "#", "" }}ff)
$check_color_alt = rgba({{ colors.primary.default.hex | set_hue: 36.0 | set_saturation: 92.0 | set_lightness: 40.0 | replace: "#", "" }}ff)
$fail_color = rgba({{ colors.primary.default.hex | set_hue: 8.0 | set_saturation: 88.0 | set_lightness: 48.0 | replace: "#", "" }}ff)
$fail_color_alt = rgba({{ colors.primary.default.hex | set_hue: 300.0 | set_saturation: 72.0 | set_lightness: 46.0 | replace: "#", "" }}ff)
$shadow = rgba({{ colors.shadow.default.hex_stripped }}33)
<* endif *>
