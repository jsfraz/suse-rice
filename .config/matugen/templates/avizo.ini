[default]
time = 1.4
y-offset = 0.78
x-offset = 0.5
width = 232
height = 220
padding = 26
border-radius = 28
border-width = 2
block-height = 14
block-spacing = 0
block-count = 20
fade-in = 0.2
fade-out = 0.4
image-opacity = 1.0
<* if {{ is_dark_mode }} *>
background = {{ colors.source_color.default.rgba | set_lightness: 18.0 | set_saturation: 42.0 | set_alpha: 0.50 }}
border-color = {{ colors.primary.default.rgba | set_saturation: 28.0 | set_lightness: 92.0 | set_alpha: 0.82 }}
bar-fg-color = {{ colors.primary.default.rgba | set_saturation: 78.0 | set_lightness: 68.0 | set_alpha: 0.90 }}
bar-bg-color = {{ colors.source_color.default.rgba | set_lightness: 10.0 | set_saturation: 30.0 | set_alpha: 0.55 }}
<* else *>
background = {{ colors.source_color.default.rgba | set_saturation: 26.0 | set_lightness: 94.0 | set_alpha: 0.55 }}
border-color = {{ colors.primary.default.rgba | set_saturation: 16.0 | set_lightness: 100.0 | set_alpha: 0.90 }}
bar-fg-color = {{ colors.primary.default.rgba | set_saturation: 82.0 | set_lightness: 48.0 | set_alpha: 0.88 }}
bar-bg-color = {{ colors.primary.default.rgba | set_saturation: 36.0 | set_lightness: 78.0 | set_alpha: 0.40 }}
<* endif *>
