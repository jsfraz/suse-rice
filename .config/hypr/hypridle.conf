# 10 minutes: screensaver. 60 minutes: display off and lock.
# Video players and fullscreen apps inhibit this (ignore_dbus_inhibit stays false).

general {
    lock_cmd = ~/.config/hypr/scripts/lockscreen.sh
    before_sleep_cmd = ~/.config/hypr/scripts/kbdlight.sh off; ~/.config/hypr/scripts/lockscreen.sh --no-fade-in
    after_sleep_cmd = hyprctl dispatch dpms on; ~/.config/hypr/scripts/kbdlight.sh restore
    on_lock_cmd = hyprsaver --quit
    ignore_dbus_inhibit = false
    inhibit_sleep = 2
}

# Keyboard backlight. 2.5 minutes, as in hypridle's sample.
# off remembers the level; a later off (sleep) does not overwrite it with 0.
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/kbdlight.sh off
    on-resume = ~/.config/hypr/scripts/kbdlight.sh restore
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/screensaver.sh
    on-resume = hyprsaver --quit
}

listener {
    timeout = 3600
    # hyprsaver --quit is non-zero when nothing is running (screensaver none).
    # Semicolons so a missing saver still turns the panel off and locks.
    on-timeout = hyprctl dispatch dpms off; hyprsaver --quit; ~/.config/hypr/scripts/lockscreen.sh
    on-resume = hyprctl dispatch dpms on
}
