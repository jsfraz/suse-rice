source = ~/.config/hypr/hyprlock-colors.conf

# lockscreen.sh writes this PNG from `rcm get wallpaper`.
# The path stays unquoted: hyprlang keeps "..." as part of a string, and the file then never opens.
background {
    monitor =
    path = ~/.cache/suse-rice/hyprlock-wallpaper.png
    blur_passes = 2
    blur_size = 3
    noise = 0.0117
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.2
}

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Same stack as the bar: tinted glass, deeper at the bottom, pale rim.
shape {
    monitor =
    size = 420, 248
    rounding = 15
    border_size = 1
    border_color = $rim
    color = $glass $glass_deep 180deg
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 56
    font_family = Source Sans 3
    shadow_passes = 1
    shadow_size = 2
    shadow_boost = 1.0
    shadow_color = $shadow
    position = 0, 52
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $muted
    font_size = 15
    font_family = Source Sans 3
    position = 0, 14
    halign = center
    valign = center
    zindex = 1
}

# Solid fill so the password stays readable: light type on a dark field, dark type on a light field.
input-field {
    monitor =
    size = 340, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $rim_input
    inner_color = $input_inner
    font_color = $font_color
    check_color = $check_color $check_color_alt 120deg
    fail_color = $fail_color $fail_color_alt 40deg
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Wrong password
    rounding = 12
    font_family = Source Sans 3
    position = 0, -64
    halign = center
    valign = center
    zindex = 2
}
