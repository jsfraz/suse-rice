source = ~/.config/hypr/hyprlock-colors.conf

# lockscreen.sh writes this PNG from `rcm get wallpaper`.
# The path stays unquoted: hyprlang keeps "..." as part of a string, and the file then never opens.
background {
    monitor =
    path = ~/.cache/suse-rice/hyprlock-wallpaper.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.94
    brightness = 1.06
    vibrancy = 0.45
    vibrancy_darkness = 0.16
}

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Shape fill is one color. The rim is the gradient: bright along the top, softer below.
shape {
    monitor =
    size = 420, 248
    rounding = 15
    border_size = 1
    border_color = $rim $rim_soft 90deg
    color = $glass
    shadow_passes = 2
    shadow_size = 24
    shadow_boost = 0.55
    shadow_color = $shadow
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = <span font_weight="600">$TIME</span>
    color = $font_color
    font_size = 56
    font_family = Source Sans 3
    shadow_passes = 1
    shadow_size = 3
    shadow_boost = 0.8
    shadow_color = $shadow
    position = 0, 52
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"<span font_weight='600'>%A, %-d %B</span>"
    color = $muted
    font_size = 16
    font_family = Source Sans 3
    position = 0, 14
    halign = center
    valign = center
    zindex = 2
}

# Gel capsule, same family as the bar buttons: saturated fill, crystal rim.
shape {
    monitor =
    size = 340, 46
    rounding = -1
    border_size = 0
    color = $input_fill
    shadow_passes = 1
    shadow_size = 8
    shadow_boost = 0.45
    shadow_color = $shadow
    position = 0, -64
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $rim_input
    inner_color = rgba(00000000)
    font_color = $input_font
    check_color = $check_color $check_color_alt 120deg
    fail_color = $fail_color $fail_color_alt 40deg
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Wrong password
    rounding = -1
    font_family = Source Sans 3
    shadow_passes = 0
    position = 0, -64
    halign = center
    valign = center
    zindex = 3
}
