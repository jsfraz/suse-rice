# Matugen palette (tabs, borders, cursor, ANSI)
include colors.conf

# Fonts
font_family       FiraCode Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         14
disable_ligatures always

# Window
background_opacity 0.6
window_padding_width     12
hide_window_decorations  yes

# Cursor
cursor_shape          underline
cursor_blink_interval 0.5
cursor_trail          0
# Keep desired cursor shape at the prompt; kitty shell integration would switch to a beam
shell_integration     no-cursor

# Tabs (colors come from colors.conf)
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2

# Scrollback
scrollback_lines  50000
scrollbar         hovered

# Bell and notifications
enable_audio_bell      no
visual_bell_duration   0
window_alert_on_bell   no
notify_on_cmd_finish   unfocused

# Mouse and clipboard
copy_on_select    clipboard
mouse_hide_wait   0
detect_urls       yes

# Open URLs with ctrl+click, not a plain click
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# Closing and keys
confirm_os_window_close  -1
kitty_mod                ctrl+shift
