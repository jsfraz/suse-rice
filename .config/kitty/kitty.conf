# Matugen palette (tabs, borders, cursor, ANSI)
include colors.conf

# Fonts — open humanist mono, slightly airier cells
font_family       FiraCode Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         14
disable_ligatures always
modify_font       cell_height 112%
modify_font       underline_thickness 140%

# Frosted glass — image, opacity and tint come from colors.conf (dark/light)
dynamic_background_opacity yes
background_blur            32

# Window
window_padding_width     16 20
hide_window_decorations  yes

# Cursor — solid block with a watery trail
cursor_shape                 block
cursor_shape_unfocused       hollow
cursor_blink_interval        0.55
cursor_trail                 160
cursor_trail_decay           0.12 0.4
cursor_trail_start_threshold 2
# Keep desired cursor shape at the prompt; kitty shell integration would switch to a beam
shell_integration            no-cursor

# Gel pill tabs (tab_bar.py) — colors come from colors.conf
tab_bar_edge          top
tab_bar_style         custom
tab_bar_align         center
tab_bar_min_tabs      2
tab_bar_margin_width  10
tab_bar_margin_height 6 6
tab_bar_background    none
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template       " {title} "
active_tab_title_template " {title} "

# Scrollback
scrollback_lines  50000
scrollbar         hovered
scrollbar_width   0.55
scrollbar_hover_width 0.95
scrollbar_radius  0.5
scrollbar_gap     0.18
scrollbar_handle_opacity 0.5
scrollbar_track_opacity  0
scrollbar_track_hover_opacity 0.12

# Bell and notifications
enable_audio_bell      no
visual_bell_duration   0
window_alert_on_bell   no
notify_on_cmd_finish   unfocused

# Mouse and clipboard
copy_on_select    clipboard
mouse_hide_wait   0
detect_urls       yes
url_style         curly
underline_hyperlinks hover

# Open URLs with ctrl+click, not a plain click
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# Closing and keys
confirm_os_window_close  -1
kitty_mod                ctrl+shift
